<ion-content [fullscreen]="true" class="login-content">
  <div class="bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <div class="grid-overlay"></div>
  </div>

  <div class="login-wrapper">
    <form class="login-card" (ngSubmit)="login()" novalidate>
      <div class="brand anim" style="--delay: 0.05s">
        <img class="brand-mark" src="assets/logo.jpeg" alt="Attendence Desk logo" />
        <h1>Attendence Desk</h1>
        <p>Attendance Portal</p>
      </div>

      <div class="field anim" style="--delay: 0.15s">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <input
          type="text"
          name="identifier"
          [(ngModel)]="identifier"
          [disabled]="isLoading"
          (input)="error = ''"
          placeholder="Username or Email"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
        />
      </div>

      <div class="field anim" style="--delay: 0.22s">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          [disabled]="isLoading"
          (input)="error = ''"
          placeholder="Password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="toggle"
          (click)="showPassword = !showPassword"
          [disabled]="isLoading"
          tabindex="-1"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
            <path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3.5 7 10 7a9.12 9.12 0 0 0 5.39-1.61" />
            <path d="m2 2 20 20" />
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
          </svg>
        </button>
      </div>

      <div class="error" *ngIf="error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" /><path d="M12 8v4" /><path d="M12 16h.01" />
        </svg>
        <span>{{ error }}</span>
      </div>

      <button type="submit" class="login-btn anim" style="--delay: 0.3s" [class.loading]="isLoading" [disabled]="isLoading">
        <span class="spinner" *ngIf="isLoading" aria-hidden="true"></span>
        <span>{{ isLoading ? 'Signing in…' : 'Sign In' }}</span>
      </button>

      <p class="hint anim" style="--delay: 0.38s">Secure access for admins &amp; employees</p>
    </form>
  </div>
</ion-content>
