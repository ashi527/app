<ion-content>
  <app-admin-navbar *ngIf="isAdmin"></app-admin-navbar>

  <div class="page-body">
    <div class="page-header">
      <div class="header-title">
        <h1>Change Password</h1>
        <p>Update your login password</p>
      </div>
      <button class="back-btn" routerLink="/profile">← Back</button>
    </div>

    <div class="info-card">
      <div class="form-group">
        <label>Current Password</label>
        <div class="pw-field">
          <input [type]="showCurrent ? 'text' : 'password'" autocomplete="current-password" placeholder="Current password" [(ngModel)]="currentPassword" />
          <button type="button" class="pw-toggle" (click)="showCurrent = !showCurrent" tabindex="-1">{{ showCurrent ? 'Hide' : 'Show' }}</button>
        </div>
      </div>

      <div class="form-group">
        <label>New Password</label>
        <div class="pw-field">
          <input [type]="showNew ? 'text' : 'password'" autocomplete="new-password" placeholder="At least 4 characters" [(ngModel)]="newPassword" />
          <button type="button" class="pw-toggle" (click)="showNew = !showNew" tabindex="-1">{{ showNew ? 'Hide' : 'Show' }}</button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="pw-field">
          <input [type]="showConfirm ? 'text' : 'password'" autocomplete="new-password" placeholder="Re-enter new password" [(ngModel)]="confirmPassword" />
          <button type="button" class="pw-toggle" (click)="showConfirm = !showConfirm" tabindex="-1">{{ showConfirm ? 'Hide' : 'Show' }}</button>
        </div>
      </div>

      <div class="button-group">
        <button class="save-btn" (click)="changePassword()" [disabled]="changing">
          {{ changing ? 'Updating…' : 'Update Password' }}
        </button>
        <button class="cancel-btn" routerLink="/profile">Cancel</button>
      </div>
    </div>
  </div>
</ion-content>
