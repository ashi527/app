<ion-content>
  <app-admin-navbar *ngIf="isAdmin"></app-admin-navbar>

  <div class="page-body">
    <div class="page-header">
      <div class="header-title">
        <h1>Profile</h1>
        <p>View and update your account</p>
      </div>
      <button *ngIf="!isAdmin" class="back-btn" [routerLink]="backLink">← Back</button>
    </div>

    <p *ngIf="loading" class="state">Loading profile…</p>
    <p *ngIf="error" class="state error">{{ error }}</p>

    <ng-container *ngIf="profile && !loading">
      <div class="hero-card">
        <label class="avatar-wrap" title="Change profile photo">
          <div class="avatar">
            <img *ngIf="profile.profile_image" [src]="profile.profile_image" alt="Profile photo" />
            <span *ngIf="!profile.profile_image">{{ initial }}</span>
          </div>
          <span class="cam-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </span>
          <input type="file" accept="image/png,image/jpeg,image/webp" (change)="selectPhoto($event)" hidden />
        </label>
        <h2>{{ profile.employee_name || profile.username }}</h2>
      </div>

      <div class="info-card">
        <div class="card-title"><h3>Account details</h3></div>

        <div class="form-grid" *ngIf="isAdmin">
          <div class="form-group full-width">
            <label>Username</label>
            <input type="text" [value]="profile.username" disabled />
          </div>
        </div>

        <div class="form-grid" *ngIf="!isAdmin">
          <div class="form-group">
            <label>Employee ID</label>
            <input type="text" [ngModel]="profile.employee_id" disabled />
          </div>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" [(ngModel)]="profile.employee_name" />
          </div>
          <div class="form-group">
            <label>Email <span class="locked">🔒 cannot be changed</span></label>
            <input type="email" [ngModel]="profile.email" disabled />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" [(ngModel)]="profile.phone" />
          </div>
          <div class="form-group">
            <label>Department</label>
            <input type="text" [(ngModel)]="profile.department" />
          </div>
          <div class="form-group">
            <label>Designation</label>
            <input type="text" [(ngModel)]="profile.designation" />
          </div>
          <div class="form-group">
            <label>Office <span class="locked">🔒 set by admin</span></label>
            <input type="text" [ngModel]="profile.location" disabled />
          </div>
          <div class="form-group full-width">
            <label>Address</label>
            <textarea rows="3" [(ngModel)]="profile.address"></textarea>
          </div>
        </div>

        <div class="button-group" *ngIf="!isAdmin">
          <button class="save-btn" (click)="saveProfile()" [disabled]="saving">
            {{ saving ? 'Saving…' : 'Save Changes' }}
          </button>
        </div>
      </div>

      <div class="card-title section-label"><h3>Security</h3></div>
      <a class="nav-card" routerLink="/change-password">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <span class="nav-text">
          <strong>Change Password</strong>
          <small>Update your login password</small>
        </span>
        <svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </a>

      <ng-container *ngIf="isAdmin">
        <div class="card-title section-label"><h3>Administration</h3></div>
        <a class="nav-card" routerLink="/manage-admins">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13A4 4 0 0 1 16 11" />
            </svg>
          </span>
          <span class="nav-text">
            <strong>Manage Admins</strong>
            <small>Create &amp; manage admin accounts</small>
          </span>
          <svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </a>
      </ng-container>

    </ng-container>

    <button class="logout-btn" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      Log Out
    </button>
  </div>
</ion-content>
