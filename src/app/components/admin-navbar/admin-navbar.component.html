<nav class="admin-navbar top-nav" aria-label="Admin navigation">
  <a class="brand" routerLink="/dashboard" (click)="closeMenu()">
    <span class="brand-mark">A</span>
    <span class="brand-copy">
      <strong>Ashi Cloud9</strong>
      <small>Attendance Admin</small>
    </span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    aria-label="Toggle navigation"
    [attr.aria-expanded]="menuOpen"
    (click)="menuOpen = !menuOpen"
  >
    <span></span><span></span><span></span>
  </button>

  <div class="nav-panel" [class.open]="menuOpen">
    <div class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
        <span class="nav-icon">⌂</span> Dashboard
      </a>
      <a routerLink="/employee" routerLinkActive="active" (click)="closeMenu()">
        <span class="nav-icon">♙</span> Employees
      </a>
      <a routerLink="/add-employee" routerLinkActive="active" (click)="closeMenu()">
        <span class="nav-icon">＋</span> Add Employee
      </a>
      <a routerLink="/report" routerLinkActive="active" (click)="closeMenu()">
        <span class="nav-icon">▥</span> Reports
      </a>
      <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">
        <span class="nav-icon">☺</span> Profile
      </a>
    </div>

    <div class="admin-actions">
      <div class="admin-profile">
        <a class="avatar" routerLink="/profile" (click)="closeMenu()" title="Open my profile">
          <img *ngIf="profileImage" [src]="profileImage" alt="Admin profile" />
          <span *ngIf="!profileImage">{{ adminName.charAt(0) }}</span>
        </a>
        <a class="profile-link" routerLink="/profile" (click)="closeMenu()">
          <small>Signed in as</small><strong>{{ adminName }}</strong>
        </a>
      </div>
      <button class="logout-btn" type="button" (click)="logout()">
        <span>↪</span> Logout
      </button>
    </div>
  </div>
</nav>

<nav class="bottom-nav" aria-label="Admin navigation">
  <a class="tab" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M9 21v-6h6v6" />
    </svg>
    <span>Home</span>
  </a>
  <a class="tab" routerLink="/employee" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" />
      <path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13A4 4 0 0 1 16 11" />
    </svg>
    <span>Staff</span>
  </a>
  <a class="tab tab-add" routerLink="/add-employee" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
    </svg>
    <span>Add</span>
  </a>
  <a class="tab" routerLink="/report" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="20" x2="12" y2="10" /><line x1="18" y1="20" x2="18" y2="4" /><line x1="6" y1="20" x2="6" y2="16" />
    </svg>
    <span>Reports</span>
  </a>
  <a class="tab" routerLink="/profile" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4" /><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" />
    </svg>
    <span>Profile</span>
  </a>
</nav>
